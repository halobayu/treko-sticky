[package]
name = "treko-sticky"
version = "0.1.0"
description = "Treko Sticky — kartu task per artist, view only, tanpa always-on-top"
authors = ["Gambir Studio"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
