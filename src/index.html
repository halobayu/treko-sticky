<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Treko Sticky</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="sticky">
  <div class="titlebar" data-tauri-drag-region>
    <span class="titlebar-title" data-tauri-drag-region>Treko Sticky</span>
    <span class="titlebar-actions" data-tauri-drag-region="false">
      <button id="btn-refresh" class="tbtn" title="Muat ulang data" aria-label="Muat ulang" data-tauri-drag-region="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg></button>
      <button id="btn-update" class="tbtn" title="Cek Update" aria-label="Cek Update" data-tauri-drag-region="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg></button>
      <button id="btn-settings" class="tbtn" title="Ganti Data URL" aria-label="Pengaturan" data-tauri-drag-region="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></button>
      <button id="btn-pin" class="tbtn" title="Selalu di atas: mati (klik untuk nyalakan)" aria-label="Selalu di atas" aria-pressed="false" data-tauri-drag-region="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="6" r="3" fill="currentColor"/><path d="M12 9v9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M8 20h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
      <button id="btn-minimize" class="tbtn" title="Minimize" aria-label="Minimize" data-tauri-drag-region="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
      <button id="btn-close" class="tbtn" title="Tutup" aria-label="Tutup" data-tauri-drag-region="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
    </span>
  </div>

  <div id="setup-view" class="setup-card" hidden>
    <h3>Treko Sticky</h3>
    <label class="setup-label" for="input-url">Data URL / Username</label>
    <input id="input-url" class="setup-input" type="text" placeholder="https://gambirstudio.com/treko/data.php?username=alyaltidak" autocomplete="off" spellcheck="false">
    <p class="setup-error" id="setup-error" hidden></p>
    <button id="btn-save-url" class="setup-btn">Simpan</button>
    <button id="btn-cancel-setup" class="setup-link" hidden>Kembali</button>
  </div>

  <div id="tabs" class="tabs" hidden>
    <button id="tab-today" class="tab active" type="button" aria-selected="true">Hari ini</button>
    <button id="tab-week" class="tab" type="button" aria-selected="false">Minggu ini</button>
  </div>

  <div id="card-view">
    <div id="card" class="acard">
      <div class="acard-head" id="acard-head">
        <div class="acard-head-top">
          <div class="acard-head-left">
            <h3 id="artist-name">—</h3>
          </div>
          <span id="petFrame" class="pet-frame"><img id="petImg" class="pet-img" src="assets/pet/pet-work.apng" alt=""></span>
        </div>
        <div class="acard-head-line" id="acard-head-line"></div>
        <span class="taskcount" id="task-count">Task 0/0</span>
      </div>
      <div class="acard-body" id="acard-body">
        <p class="meta" id="status">Memuat data…</p>
      </div>
    </div>
  </div>

  <div id="week-view" hidden>
    <div id="wcard" class="acard">
      <div class="acard-head" id="wcard-head">
        <h3 id="week-title">Minggu ini</h3>
        <span class="taskcount" id="week-count">Selesai 0/0</span>
      </div>
      <div class="acard-body" id="week-body">
        <p class="meta">Belum ada data minggu ini.</p>
      </div>
    </div>
  </div>

  <p class="foot" id="foot"></p>
</div>
<script src="main.js"></script>
</body>
</html>
